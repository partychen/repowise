[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repowise"
version = "0.0.1"
description = "RepoWise: project knowledge for PR review and authorized feature implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
repowise = "repowise.cli:main"

[tool.setuptools]
packages = ["repowise", "repowise_packs"]
package-dir = {repowise = ".github/skills/repowise/scripts/repowise", repowise_packs = ".github/skills/repowise/packs"}

[tool.setuptools.package-data]
repowise_packs = ["*.json", "sources/*.json"]
