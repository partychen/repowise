name: Skill regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        if: matrix.python == '3.13'
        with:
          node-version: "22"
      - name: Install Skill and exercise the learning workflow
        if: matrix.python == '3.13'
        env:
          REVIEW_MEMORY_TEST_INSTALL: "1"
        run: python -m unittest tests.test_installed_workflow -v
